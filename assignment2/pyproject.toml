[project]
name = "pilab-assignment1"
version = "0.1.0"
description = "Cumulative PiLab reference implementation through Assignment 1"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pilab-support==0.2.0",
  "pyyaml>=6,<7",
]

[project.scripts]
pilab = "pilab.cli:main"

[tool.uv.sources]
pilab-support = { path = "wheels/pilab_support-0.2.0-py3-none-any.whl" }

[dependency-groups]
dev = [
  "ruff>=0.14.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilab"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
  "/src", "/examples", "/wheels", "/.agents", "/LICENSE", "/pyproject.toml", "/uv.lock",
  "/requirements.txt",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env", "**/.env.*", "**/.pilab/**", "**/.venv/**"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["RUF002", "RUF003"]
